[project]
name = "slovech"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "aiogram>=3.20,<4", "aiohttp>=3.9,<4", "pydantic-settings>=2.8,<3", "python-docx>=1.1,<2",
  "yt-dlp>=2025.3", "youtube-transcript-api>=1.0,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".local", ".venv312"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
