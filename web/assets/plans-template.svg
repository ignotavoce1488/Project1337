<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <radialGradient id="background" cx="50%" cy="36%" r="82%">
      <stop stop-color="#41201b"/>
      <stop offset=".55" stop-color="#241511"/>
      <stop offset="1" stop-color="#130d0b"/>
    </radialGradient>
    <linearGradient id="featured" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#633027"/>
      <stop offset="1" stop-color="#321a16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1">
      <stop stop-color="#f3c3a7"/>
      <stop offset="1" stop-color="#d88a72"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#080403" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#background)"/>
  <circle cx="1050" cy="70" r="340" fill="#be5d49" opacity=".07"/>
  <circle cx="30" cy="710" r="360" fill="#e28f6d" opacity=".045"/>

  <!-- Brand mark is rendered from the Mini App's exact Newsreader/Manrope styles. -->
  <image x="60" y="49" width="262.6" height="79" href="__BRAND_IMAGE__"/>
  <text x="1138" y="95" fill="#b99180" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5" text-anchor="end">01  /  02  /  03</text>
  <path d="M60 152H1140" stroke="#725044" stroke-opacity=".52"/>

  <text x="600" y="232" fill="#f7e8d4" font-family="Arial,sans-serif" font-size="54" font-weight="700" text-anchor="middle" direction="auto">__HEADING__</text>

  <g filter="url(#soft-shadow)">
    <rect x="60" y="285" width="340" height="352" rx="30" fill="#2c1d18" stroke="#755044" stroke-width="2"/>
    <rect x="430" y="270" width="340" height="382" rx="32" fill="url(#featured)" stroke="#e7a089" stroke-width="3"/>
    <rect x="800" y="285" width="340" height="352" rx="30" fill="#2c1d18" stroke="#755044" stroke-width="2"/>
  </g>

  <circle cx="111" cy="340" r="25" fill="#5a382e"/>
  <path d="M111 324v32M96 340h30M100 330c7 7 15 13 22 20M122 330c-7 7-15 13-22 20" stroke="#efb39d" stroke-width="3" stroke-linecap="round"/>
  <circle cx="481" cy="325" r="25" fill="#a44c3b"/>
  <path d="m481 311 13 14-13 14-13-14z" fill="none" stroke="#ffe0c2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="851" cy="340" r="25" fill="#5a382e"/>
  <circle cx="851" cy="340" r="12" fill="none" stroke="#efb39d" stroke-width="3"/>
  <path d="M851 331v10l7 4" fill="none" stroke="#efb39d" stroke-width="3" stroke-linecap="round"/>

  <text x="230" y="413" fill="#f7e8d4" font-family="Arial,sans-serif" font-size="33" font-weight="700" text-anchor="middle" direction="auto">__FREE__</text>
  <text x="600" y="398" fill="#fff1db" font-family="Arial,sans-serif" font-size="33" font-weight="700" text-anchor="middle" direction="auto">__SUBSCRIPTION__</text>
  <text x="970" y="413" fill="#f7e8d4" font-family="Arial,sans-serif" font-size="33" font-weight="700" text-anchor="middle" direction="auto">__HOURS__</text>

  <text x="230" y="516" fill="#fff3df" font-family="Arial,sans-serif" font-size="71" font-weight="700" text-anchor="middle">0 ₽</text>
  <text x="600" y="501" fill="url(#accent)" font-family="Arial,sans-serif" font-size="71" font-weight="700" text-anchor="middle">250 ₽</text>
  <text x="970" y="516" fill="#fff3df" font-family="Arial,sans-serif" font-size="71" font-weight="700" text-anchor="middle">50 ₽+</text>

  <path d="M95 548H365M465 533H735M835 548H1105" stroke="#876053" stroke-opacity=".55"/>
  <text x="230" y="597" fill="#d9b7a4" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle">2 / 28 d</text>
  <text x="600" y="586" fill="#ffe3cb" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle">40 h / 28 d</text>
  <text x="970" y="597" fill="#d9b7a4" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle">1–4 h</text>

  <rect x="60" y="682" width="1080" height="47" rx="23.5" fill="#35211b" stroke="#745044"/>
  <circle cx="90" cy="705" r="5" fill="#e7a089"/>
  <text x="600" y="716" fill="#eec3ae" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle">1.5 h = 70 ₽   ·   4 h = 155 ₽</text>
